<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A quiet green valley with rolling hills, trees, and a winding path">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F9F2"/>
      <stop offset="0.55" stop-color="#EDF2E6"/>
      <stop offset="1" stop-color="#D9E4D0"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FBFCF4" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#F4F7EC" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F4F7EC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFF3E9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#EFF3E9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#EFF3E9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="farHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C1D0BE"/>
      <stop offset="1" stop-color="#B5C3B4"/>
    </linearGradient>
    <linearGradient id="midHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B5C3B4"/>
      <stop offset="1" stop-color="#9FB29B"/>
    </linearGradient>
    <linearGradient id="nearHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#738A6C"/>
      <stop offset="1" stop-color="#5F775A"/>
    </linearGradient>
    <linearGradient id="foreground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#526749"/>
      <stop offset="1" stop-color="#3F5238"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFF3E9" stop-opacity="0.2"/>
      <stop offset="0.45" stop-color="#EFF3E9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#DCE6D3" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="mist" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.12"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1135" cy="235" r="250" fill="url(#sun)"/>
  <circle cx="1135" cy="235" r="74" fill="#FBFCF4" opacity="0.55"/>

  <g filter="url(#soft)" fill="#FBFCF6">
    <ellipse cx="330" cy="250" rx="250" ry="38" opacity="0.7"/>
    <ellipse cx="520" cy="215" rx="160" ry="26" opacity="0.5"/>
    <ellipse cx="1260" cy="340" rx="300" ry="34" opacity="0.55"/>
    <ellipse cx="930" cy="410" rx="260" ry="26" opacity="0.4"/>
  </g>

  <path d="M0 566 C 190 524 350 552 520 526 C 700 498 835 548 995 520 C 1170 490 1340 526 1600 492 L1600 1000 L0 1000 Z" fill="url(#farHill)" opacity="0.92"/>
  <path d="M0 646 C 205 596 355 626 535 604 C 760 576 915 642 1115 608 C 1310 575 1460 612 1600 588 L1600 1000 L0 1000 Z" fill="url(#midHill)" opacity="0.96"/>

  <rect y="560" width="1600" height="190" fill="url(#haze)" opacity="0.55" filter="url(#mist)"/>

  <path d="M0 746 C 235 698 430 738 630 708 C 870 672 1045 742 1255 706 C 1410 680 1515 704 1600 690 L1600 1000 L0 1000 Z" fill="url(#nearHill)"/>

  <g fill="#526749" opacity="0.55">
    <path d="M110 742 l16 -46 16 46 z"/>
    <path d="M136 748 l13 -38 13 38 z"/>
    <path d="M86 750 l11 -31 11 31 z"/>
    <path d="M1445 724 l18 -52 18 52 z"/>
    <path d="M1474 730 l14 -41 14 41 z"/>
    <path d="M1418 732 l12 -35 12 35 z"/>
    <path d="M1502 734 l11 -30 11 30 z"/>
  </g>

  <path d="M0 884 C 260 826 500 882 750 848 C 1000 814 1235 882 1600 828 L1600 1000 L0 1000 Z" fill="url(#foreground)"/>

  <path d="M815 1000 C 800 948 760 922 782 882 C 803 844 852 832 842 798 C 833 766 790 756 800 728" fill="none" stroke="url(#trail)" stroke-width="26" stroke-linecap="round"/>
  <path d="M815 1000 C 800 948 760 922 782 882 C 803 844 852 832 842 798 C 833 766 790 756 800 728" fill="none" stroke="#EFF3E9" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

  <g fill="#35452F" opacity="0.85">
    <path d="M1220 892 l22 -66 22 66 z"/>
    <path d="M1256 900 l17 -51 17 51 z"/>
    <path d="M1188 902 l14 -42 14 42 z"/>
    <path d="M1290 906 l12 -35 12 35 z"/>
    <path d="M310 900 l24 -72 24 72 z"/>
    <path d="M350 908 l18 -55 18 55 z"/>
    <path d="M274 910 l15 -45 15 45 z"/>
    <path d="M386 914 l13 -39 13 39 z"/>
  </g>

  <g stroke="#B5C3B4" stroke-width="2" stroke-linecap="round" opacity="0.45">
    <path d="M120 952 q14 -18 28 0"/>
    <path d="M150 960 q10 -14 21 0"/>
    <path d="M1390 946 q16 -20 32 0"/>
    <path d="M1428 956 q11 -15 23 0"/>
    <path d="M680 966 q12 -16 25 0"/>
    <path d="M710 972 q9 -12 19 0"/>
  </g>

  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.35" style="mix-blend-mode:multiply"/>
</svg>
